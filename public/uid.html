<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UID test</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script></head>
<body style="font-family:sans-serif;padding:16px">
<h3>Test UID</h3>
<button id="b" style="font-size:20px;padding:12px">Lire mon uid</button>
<p id="o" style="word-break:break-all;font-size:18px"></p>
<script>
Pi.init({version:"2.0",sandbox:true});
document.getElementById('b').onclick=async()=>{
  const o=document.getElementById('o');
  try{
    const a=await Pi.authenticate(['username','payments','wallet_address'],function(p){});
    o.textContent='uid : '+a.user.uid+' | user : '+a.user.username;
  }catch(e){o.textContent='Erreur : '+e.message}
};
</script></body></html>
